name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build on-chain program (.so)
        run: cargo build-sbf --manifest-path programs/token_program/Cargo.toml
      - name: cargo test
        run: cargo test --workspace
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - name: Root tests
        run: npm test
      - name: Root typecheck
        run: npm run typecheck
      - name: Root lint
        run: npm run lint
      - name: App typecheck
        run: npm run typecheck --workspace app
      - name: App lint
        run: npm run lint --workspace app
      - name: App build
        run: npm run build --workspace app
      - name: Readiness dry-run smoke check
        run: |
          CLUSTER=localhost \
          DECIMALS=9 \
          SUPPLY=1000 \
          TRANSFER_FEE_BPS=0 \
          TRANSFER_FEE_MAX_BASE_UNITS=18446744073709551615 \
          WALLET=/tmp/mamba-ci-wallet-does-not-exist.json \
          npm run validate:launch
      - name: Strict readiness must reject missing governance
        run: |
          if CLUSTER=devnet \
            STRICT_LAUNCH=1 \
            DECIMALS=9 \
            SUPPLY=1000 \
            TRANSFER_FEE_BPS=0 \
            TRANSFER_FEE_MAX_BASE_UNITS=18446744073709551615 \
            WALLET=/tmp/mamba-ci-wallet-does-not-exist.json \
            npm run validate:launch:strict; then
            echo "Strict readiness unexpectedly passed without governance."
            exit 1
          fi
      - name: Strict readiness must reject missing wallet
        run: |
          if CLUSTER=devnet \
            STRICT_LAUNCH=1 \
            AUTHORITY_MULTISIG=11111111111111111111111111111111 \
            DECIMALS=9 \
            SUPPLY=1000 \
            TRANSFER_FEE_BPS=0 \
            TRANSFER_FEE_MAX_BASE_UNITS=18446744073709551615 \
            WALLET=/tmp/mamba-ci-wallet-does-not-exist.json \
            npm run validate:launch:strict; then
            echo "Strict readiness unexpectedly passed without a wallet."
            exit 1
          fi
