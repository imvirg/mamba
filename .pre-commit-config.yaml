repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path Cargo.toml --
        language: system
        types: [rust]
        pass_filenames: false

      - id: prettier
        name: prettier (lint:fix)
        entry: npm run --silent lint:fix --
        language: system
        files: \.(js|ts)$
        pass_filenames: false
